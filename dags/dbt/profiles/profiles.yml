airflow_course:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_WAREHOUSE_HOST', 'warehouse-postgres') }}"
      port: "{{ env_var('DBT_WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_WAREHOUSE_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_ENV_SECRET_WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('DBT_WAREHOUSE_DB', 'warehouse') }}"
      schema: "{{ env_var('DBT_WAREHOUSE_SCHEMA', 'analytics') }}"
      threads: 4
      connect_timeout: 10