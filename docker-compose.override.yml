# Two services this course adds to the stack Astro generates:
#
#   warehouse-postgres   the course's application warehouse (a second Postgres)
#   orders-api           the synthetic orders API, the pipeline's only data source
#
# Both are reached by Airflow task code over the `airflow` network by service
# name, which is the one thing about service-to-service addressing that has to
# be learned here rather than read about. See reference/environment-baseline.md
# §7 for the two traps that are not guessable: an override service needs
# `networks: [airflow]`, and `${VAR}` is not interpolated from the project's
# `.env` by `astro dev start`.
#
# Neither service is part of the pipeline repository's source. The API lives in
# its own project (ADR 0005) so the portfolio artifact holds only the pipeline
# and the dbt project; the image below is built from that sibling checkout, and
# `docker build -t orders-api:1.0.0 .` in it is what puts the tag on this box.
#
# ---------------------------------------------------------------------------
# Course application warehouse.
#
# Astro already runs a Postgres for Airflow's own metadata database. That is a
# different engine with a different job: it holds dag_run, task_instance,
# dag_file, connection and the other Airflow tables, it is owned by Airflow's
# db-migration one-shot, and in Airflow 3 task code is forbidden from writing
# to it. It is not a warehouse and pipeline tables must never land in it.
#
# The course's warehouse holds pipeline data only. It is kept separate on
# every axis that makes the two tellable apart:
#
#   service name   warehouse-postgres  vs  postgres
#   database       warehouse          vs  postgres
#   role           warehouse          vs  postgres
#   host port      5433               vs  5432
#   volume         warehouse_data     vs  postgres_data
#   secret         warehouse_pg_password (file) vs  none
#   conn_id        warehouse_default  vs  (Airflow's own connections)
#
# No `container_name` is set on purpose: it would replace the service name as
# the network alias, and `warehouse-postgres` is the hostname the Airflow
# containers resolve.
#
# `astro dev start` merges this file into the in-memory compose model it
# builds. Nothing here replaces an Airflow service, so the stack still comes
# up as the documented shape plus this one container.
#
# Course simplification, stated plainly: in production the warehouse is a
# managed engine (BigQuery, Snowflake, Redshift) and the credential arrives
# from a secrets backend, not from a local container's env var. Two things
# would differ: the engine is operated by someone else, and the password is
# rotated by that operator rather than by `POSTGRES_PASSWORD` here.
services:
  warehouse-postgres:
    image: docker.io/postgres:15.14-alpine3.22
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_DB: warehouse
      # Read from a bind-mounted secret rather than interpolated from .env:
      # `astro dev start` builds its compose model in-process and does not
      # resolve ${VAR} from the project's .env, so interpolation here would
      # only work in a shell that happened to export the variable first.
      POSTGRES_PASSWORD_FILE: /run/secrets/warehouse_pg_password
    secrets:
      - warehouse_pg_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    # Join the network the Airflow containers are already on. `airflow` is the
    # *key* the base model declares, which is why the network is created as
    # <project>_<hash>_airflow; referencing the key keeps this file free of
    # the project-path hash, so it survives a re-clone to a different
    # directory. Without this the service lands on a second, Airflow-invisible
    # network and `warehouse-postgres` will not resolve.
    networks:
      - airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The synthetic orders API, ADR 0005. Frozen fixture: `orders-api/1.0.0`, the
  # same contract recorded in reference/orders-api-contract.md.
  #
  # The image is a local build rather than a registry pull, because the API is a
  # separate project that this repository does not own and must not vendor. The
  # tag carries the contract version, which is the only thing this repository
  # pins; the upstream build pins its own base image by digest, so the tag names
  # a reproducible image rather than whatever `latest` happened to be.
  #
  # No `container_name`, for the same reason as the warehouse: it would replace
  # the service name as the network alias, and `orders-api` is the hostname
  # dags/pipeline/ resolves. `networks: [airflow]` is load-bearing for the same
  # reason as above and is not optional.
  orders-api:
    image: orders-api:1.0.0
    # `python:3.14.7-slim` ships neither curl nor wget, and the fixture has no
    # reason to grow one. Python is already in the image, so the healthcheck
    # speaks HTTP with the interpreter instead of adding a package to reach it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as r; raise SystemExit(0 if r.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
    # Published to the host as well as joined to the `airflow` network, for two
    # distinct reasons that must not be confused:
    #
    #   * dags/pipeline/ reaches it as `http://orders-api:8000`, over the
    #     container network, by service name. That is the lesson.
    #   * the pipeline assertion reaches it as `http://127.0.0.1:8010`, from
    #     outside the stack, to compute its expected values over HTTP rather
    #     than by reading the warehouse the models under test write to.
    #
    # Bound to loopback only. Nothing on the LAN can reach the fixture.
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - airflow

secrets:
  warehouse_pg_password:
    file: ./.secrets/warehouse_pg_password

volumes:
  warehouse_data:
